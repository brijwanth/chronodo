<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="A card-catalog for your habits — log activities, track consistency, hit your goals.">
<title>Chronodo — Activity Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app" class="app">

  <!-- Top bar -->
  <header class="drawer-head">
    <div class="drawer-head__top">
      <button id="btn-menu" class="icon-btn" title="Menu" aria-label="Open menu" aria-expanded="false">&#9776;</button>
      <h1 class="brand"><span id="brand-view">Chronodo</span></h1>
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
  </header>

  <!-- Slide-out navigation -->
  <div id="nav-scrim" class="nav-scrim" hidden></div>
  <nav id="nav-panel" class="nav-panel" role="tablist" aria-label="Views" aria-hidden="true">
    <div class="nav-panel__head">Views</div>
    <button class="drawer-tab is-active" data-view="rolodex" role="tab" aria-selected="true">Chronodo</button>
    <button class="drawer-tab" data-view="list" role="tab" aria-selected="false">List</button>
    <button class="drawer-tab" data-view="calendar" role="tab" aria-selected="false">Calendar</button>
    <button class="drawer-tab" data-view="tags" role="tab" aria-selected="false">Tags</button>
    <button class="drawer-tab" data-view="recommend" role="tab" aria-selected="false">Suggested</button>
  </nav>

  <main id="main" class="main"></main>

  <button id="btn-add" class="fab" title="New activity" aria-label="Add activity">+</button>
</div>

<!-- Templates -->
<template id="tpl-card">
  <article class="card" tabindex="0">
    <div class="card__tab" aria-hidden="true"></div>
    <header class="card__head">
      <h2 class="card__title"></h2>
      <div class="card__tags"></div>
    </header>
    <div class="card__streak" aria-label="Last 7 days"></div>
    <div class="card__stats"></div>
    <footer class="card__actions">
      <button class="btn btn--stamp" data-action="mark-done">Stamp today</button>
      <button class="btn btn--ghost" data-action="timer">Start timer</button>
      <button class="btn btn--text" data-action="open">Open card &rsaquo;</button>
    </footer>
  </article>
</template>

<template id="tpl-list-row">
  <div class="row" tabindex="0">
    <div class="row__stamp" data-action="mark-done" title="Stamp today" role="button" aria-label="Mark done today"></div>
    <div class="row__body" data-action="open">
      <div class="row__title"></div>
      <div class="row__tags"></div>
    </div>
    <div class="row__streak" aria-label="Last 7 days"></div>
    <button class="btn btn--ghost btn--sm" data-action="timer">Timer</button>
  </div>
</template>

<script type="module" src="js/app.js"></script>
</body>
</html>
